<!doctype html>
<html lang="de-AT"><head><meta charset="utf-8"><title>Hintergrund Impressum</title>
<!-- Hintergrund zum Drübersprechen (1080 × 1920, 20 s): Überschrift „Impressum“, ein Profil, in dessen Bio der Impressum-Link erscheint.
     Unterer Bereich (ab ca. 1250 px) bleibt frei für die automatischen Untertitel. -->
<style>
@font-face{font-family:"Source Serif 4";font-weight:600;src:url("../../src/fonts/source-serif-4-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url("../../src/fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url("../../src/fonts/inter-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url("../../src/fonts/inter-latin-600-normal.woff2") format("woff2")}
:root{--navy:#1B2440;--paper:#F5F6F8;--rot:#7A1F2B;--leise:#5A6278}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:Inter,sans-serif;color:var(--navy)}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
#a{width:760px;height:760px;background:var(--navy);opacity:.12}
#b{width:620px;height:620px;background:var(--rot);opacity:.11}
.handle{right:160px;top:250px;font-size:30px;color:var(--leise)}
.titel{left:108px;top:330px}
.kick{font-size:28px;font-weight:600;color:var(--rot);letter-spacing:.06em;text-transform:uppercase}
h1{font-family:"Source Serif 4",serif;font-weight:600;font-size:150px;line-height:1.05;margin-top:14px;display:inline-block;position:relative}
h1 .strich{position:absolute;left:0;bottom:6px;height:12px;background:var(--rot);width:0}
.karte{left:108px;right:160px;top:640px;background:#fff;border-radius:36px;padding:48px 48px 52px;box-shadow:0 30px 70px rgba(27,36,64,.16)}
.oben{display:flex;align-items:center;gap:36px}
.avatar{width:150px;height:150px;border-radius:50%;background:var(--navy);color:var(--paper);font-family:"Source Serif 4",serif;font-weight:600;font-size:60px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--rot)}
.zahlen{display:flex;gap:40px;flex:1;justify-content:space-around;text-align:center}
.zahlen b{display:block;font-size:36px;font-weight:600}
.zahlen span{font-size:24px;color:var(--leise)}
.name{font-size:32px;font-weight:600;margin-top:34px}
.bio{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.bar{height:22px;border-radius:11px;background:#E6E8EB}
.link{position:relative;display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:600;color:var(--navy);margin-top:10px;align-self:flex-start;padding:10px 20px;border-radius:14px;background:#EEF0F4}
.link svg{width:34px;height:34px}
.cursor{display:inline-block;width:4px;height:38px;background:var(--rot);vertical-align:middle}
.kreis{left:-34px;top:-26px;overflow:visible}
.haken{position:absolute;right:-26px;top:-26px;width:56px;height:56px;border-radius:50%;background:var(--rot);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;font-weight:600}
.knoepfe{display:flex;gap:16px;margin-top:34px}
.knoepfe div{flex:1;height:64px;border-radius:14px;background:#EEF0F4}
</style></head><body>
<div class="blob" id="a"></div><div class="blob" id="b"></div>
<div class="abs handle">@die.contentjuristin</div>

<div class="abs titel" id="titel"><div class="kick">Recht im Alltag</div><h1>Impressum<i class="strich" id="strich"></i></h1></div>

<div class="abs karte" id="karte">
  <div class="oben"><div class="avatar">CJ</div>
    <div class="zahlen"><div><b>128</b><span>Beiträge</span></div><div><b>4.210</b><span>Follower</span></div><div><b>312</b><span>Gefolgt</span></div></div></div>
  <div class="name">Dein Business</div>
  <div class="bio">
    <div class="bar" style="width:88%"></div>
    <div class="bar" style="width:64%"></div>
    <div class="link" id="link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
      <span id="linktext"></span><span class="cursor" id="cursor"></span>
      <svg class="abs kreis" id="kreis" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M8 55 C6 20 40 6 70 8 C96 10 99 40 94 62 C88 90 30 96 12 82 C2 74 2 50 14 30" fill="none" stroke="#7A1F2B" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" id="kreispfad"/></svg>
      <div class="haken" id="haken">✓</div>
    </div>
  </div>
  <div class="knoepfe"><div></div><div></div><div></div></div>
</div>
<script>
const T = 20, w = 2 * Math.PI / T;
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const WORT = "Impressum";
window.DAUER = T;
window.zeige = (t) => {
  $("a").style.transform = `translate(${-180 + 120 * Math.sin(w * t)}px,${200 + 90 * Math.cos(w * t)}px)`;
  $("b").style.transform = `translate(${520 + 110 * Math.cos(w * t)}px,${1000 + 120 * Math.sin(w * t)}px)`;
  // Überschrift
  const ti = ease(p(t, 0, 0.7));
  $("titel").style.opacity = ti; $("titel").style.transform = `translateY(${(1 - ti) * 40}px)`;
  $("strich").style.width = ease(p(t, 0.6, 1.3)) * 100 + "%";
  // Profilkarte, schwebt danach leicht
  const k = ease(p(t, 0.5, 1.3));
  $("karte").style.opacity = k;
  $("karte").style.transform = `translateY(${(1 - k) * 120 + 8 * Math.sin(w * 2 * t)}px)`;
  // Link wird in die Bio getippt (zum Satz „… gehört in die Bio“)
  const n = Math.round(p(t, 1.8, 3.2) * WORT.length);
  $("linktext").textContent = WORT.slice(0, n);
  const l = $("link");
  l.style.opacity = t < 1.7 ? 0 : 1;
  $("cursor").style.opacity = t < 1.7 || t > 3.6 ? 0 : (t < 3.2 || Math.floor(t * 3) % 2 ? 1 : 0);
  // Hervorhebung: Fläche wird rot, Kreis zeichnet sich, Häkchen springt rein
  const h = p(t, 3.4, 3.8);
  l.style.background = `rgba(122,31,43,${0.1 * h + (1 - h) * 0})`;
  l.style.backgroundColor = h ? `rgba(122,31,43,${0.1 * h})` : "#EEF0F4";
  l.style.transform = `scale(${1 + 0.04 * Math.sin(Math.PI * h) + (t > 5 ? 0.015 * Math.sin(w * 4 * (t - 5)) : 0)})`;
  const kr = $("kreis"); kr.style.width = l.offsetWidth + 68 + "px"; kr.style.height = l.offsetHeight + 52 + "px";
  $("kreispfad").style.strokeDashoffset = 1 - ease(p(t, 3.6, 4.4));
  const hk = p(t, 4.3, 4.8);
  $("haken").style.opacity = hk ? 1 : 0;
  $("haken").style.transform = `scale(${hk ? back(hk) : 0})`;
};
window.zeige(0);
</script></body></html>
