<!doctype html>
<html lang="de-AT"><head><meta charset="utf-8"><title>Drei Clips</title>
<!-- Drei kurze Clips für die Schnitt-Timeline-Demo (24. und 31.12.). ?clip=1|2|3
     Jeder Clip hat eine eigene Grundfarbe, damit man sie in der Timeline gut unterscheidet. -->
<style>
@font-face{font-family:"Source Serif 4";font-weight:600;src:url("../../src/fonts/source-serif-4-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url("../../src/fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url("../../src/fonts/inter-latin-600-normal.woff2") format("woff2")}
:root{--navy:#1B2440;--paper:#F5F6F8;--rot:#7A1F2B;--leise:#5A6278}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.handle{right:160px;top:250px;font-size:30px}
.kick{font-size:28px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.serif{font-family:"Source Serif 4",serif;font-weight:600}
.clip{display:none;position:absolute;inset:0}
/* Clip 1: Papier */
#c1{background:var(--paper);color:var(--navy)}
#c1 .kick{color:var(--rot)}
#c1 h1{font-size:150px;line-height:1;margin-top:20px;position:relative;display:inline-block}
#c1 .strich{position:absolute;left:0;bottom:4px;height:14px;background:var(--rot)}
#c1 .unter{font-size:44px;line-height:1.35;color:var(--leise);margin-top:50px}
/* Clip 2: Navy, Checkliste */
#c2{background:var(--navy);color:var(--paper)}
#c2 .kick{background:var(--rot);color:var(--paper);padding:6px 14px;display:inline-block}
#c2 h2{font-size:96px;line-height:1.08;margin-top:30px}
.liste{margin-top:60px;display:flex;flex-direction:column;gap:30px}
.punkt{display:flex;align-items:center;gap:30px;font-size:48px}
.box{width:64px;height:64px;border-radius:14px;border:4px solid var(--paper);display:flex;align-items:center;justify-content:center;flex:none;font-size:40px;font-weight:600}
/* Clip 3: Dunkelrot */
#c3{background:var(--rot);color:var(--paper)}
#c3 .gross{font-size:150px;line-height:1.02}
#c3 .unter{font-size:44px;line-height:1.35;margin-top:50px;opacity:.85}
.ring{width:200px;height:200px;border-radius:50%;border:10px solid var(--paper);display:flex;align-items:center;justify-content:center;font-size:110px;margin-bottom:60px}
</style></head><body>

<div class="clip" id="c1">
  <div class="blob" id="b1a" style="width:760px;height:760px;background:#1B2440;opacity:.12"></div>
  <div class="blob" id="b1b" style="width:620px;height:620px;background:#7A1F2B;opacity:.11"></div>
  <div class="abs handle" style="color:#5A6278">@die.contentjuristin</div>
  <div class="abs" id="t1" style="left:108px;right:160px;top:620px">
    <div class="kick">Recht im Alltag</div>
    <h1 class="serif">Impressum<i class="strich" id="s1"></i></h1>
    <div class="unter" id="u1">Wer geschäftlich postet,<br>braucht eins.</div>
  </div>
</div>

<div class="clip" id="c2">
  <div class="blob" id="b2a" style="width:700px;height:700px;background:#7A1F2B;opacity:.35"></div>
  <div class="abs handle" style="color:#C3C5CD">@die.contentjuristin</div>
  <div class="abs" style="left:108px;right:160px;top:520px">
    <div class="kick" id="k2">Was rein muss</div>
    <h2 class="serif" id="h2">Kurz gesagt:</h2>
    <div class="liste" id="liste">
      <div class="punkt"><div class="box"></div>Name</div>
      <div class="punkt"><div class="box"></div>Anschrift</div>
      <div class="punkt"><div class="box"></div>Kontakt</div>
    </div>
  </div>
</div>

<div class="clip" id="c3">
  <div class="blob" id="b3a" style="width:720px;height:720px;background:#1B2440;opacity:.35"></div>
  <div class="abs handle" style="color:#EBD3D7">@die.contentjuristin</div>
  <div class="abs" id="t3" style="left:108px;right:160px;top:560px">
    <div class="ring" id="r3">✓</div>
    <div class="serif gross">Link in<br>die Bio.</div>
    <div class="unter">Fertig. Speichern für später.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const clip = +(new URLSearchParams(location.search).get("clip") || 1);
const DAUERN = { 1: 6, 2: 8, 3: 6 };
window.DAUER = DAUERN[clip];
$("c" + clip).style.display = "block";
const rein = (el, t, a) => { const k = ease(p(t, a, a + 0.6)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 50}px)`; };
const schweb = (id, x, y, rx, ry, t, ph = 0) => { const w = 2 * Math.PI / 12; $(id).style.transform = `translate(${x + rx * Math.sin(w * t + ph)}px,${y + ry * Math.cos(w * t + ph)}px)`; };

window.zeige = (t) => {
  if (clip === 1) {
    schweb("b1a", -180, 200, 120, 90, t); schweb("b1b", 520, 1000, 110, 120, t, 1);
    rein($("t1"), t, 0.1);
    $("s1").style.width = ease(p(t, 0.7, 1.4)) * 100 + "%";
    rein($("u1"), t, 1.4);
  }
  if (clip === 2) {
    schweb("b2a", 500, 1100, 140, 100, t);
    rein($("k2"), t, 0.1); rein($("h2"), t, 0.3);
    [...$("liste").children].forEach((el, i) => {
      rein(el, t, 0.9 + i * 0.5);
      const h = p(t, 2.6 + i * 0.9, 2.9 + i * 0.9);
      const box = el.querySelector(".box");
      box.textContent = h > 0 ? "✓" : "";
      box.style.background = h > 0 ? "#F5F6F8" : "transparent";
      box.style.color = "#1B2440";
      box.style.transform = `scale(${h > 0 ? back(h) : 1})`;
    });
  }
  if (clip === 3) {
    schweb("b3a", -150, 1000, 130, 110, t);
    rein($("t3"), t, 0.1);
    const r = p(t, 0.5, 1.0);
    $("r3").style.transform = `scale(${r ? back(r) : 0})`;
    $("t3").style.transform += ` scale(${1 + 0.006 * t})`;
  }
};
window.zeige(3);
</script></body></html>
