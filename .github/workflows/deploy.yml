# Baut die Website bei jedem Push auf "main" und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solange die Seite unter <name>.github.io/contentjuristin-blog/ läuft, braucht es das Pfad-Präfix.
      # Mit eigener Domain: PATH_PREFIX auf "/" setzen.
      - run: npx @11ty/eleventy --pathprefix="$PATH_PREFIX"
        env:
          PATH_PREFIX: /contentjuristin-blog/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
